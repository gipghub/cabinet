<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Cabinet — OTC Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b3f37">
<meta name="application-name" content="Cabinet">
<meta name="description" content="A calm apothecary cabinet for the over-the-counter medicines you keep at home.">

<!-- iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cabinet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!-- Set standalone class as early as possible to avoid a layout flash -->
<script>
  (function () {
    var embedded;
    try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    var standalone = !embedded && (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.navigator.standalone === true
    );
    document.documentElement.classList.toggle('standalone', standalone);
  })();
</script>

<!-- Google fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>
  html, body { width: 100%; height: 100%; margin: 0; }

  /* ── Browser preview: device frame on a soft scene ───────── */
  body {
    background:
      radial-gradient(120% 80% at 50% 0%, #e8efec 0%, #d1ddd8 60%, #b5c4be 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage { display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

  /* ── Installed (standalone): fill the real screen, no bezel ─ */
  html.standalone, html.standalone body {
    background: var(--bg, #eef4f3);
    overflow: hidden;
  }
  html.standalone body { display: block; }
  html.standalone #root,
  html.standalone .fullapp {
    width: 100vw;
    height: 100dvh;
  }
  html.standalone .fullapp { position: relative; overflow: hidden; }

  /* Top spacer clears the real status bar (notch / Android bar). */
  html.standalone .app-statusbar { height: max(env(safe-area-inset-top), 12px); }
  /* Bottom of the tab bar clears the home indicator / gesture area. */
  html.standalone .tabbar { padding-bottom: max(env(safe-area-inset-bottom), 14px); }

  /* Loading splash */
  #boot {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: var(--bg, #eef4f3);
    font-family: 'Instrument Serif', Georgia, serif; color: #13322b;
  }
  #boot img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 10px 30px rgba(19,50,43,0.22); }
  #boot .dots { display: flex; gap: 6px; }
  #boot .dots i { width: 7px; height: 7px; border-radius: 50%; background: #2f6b5f; animation: bootpulse 1.1s ease-in-out infinite; }
  #boot .dots i:nth-child(2) { animation-delay: .15s; }
  #boot .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bootpulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>

<div id="boot">
  <img src="icon-192.png" alt="Cabinet">
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Starter components -->
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="pwa.jsx"></script>

<!-- App pieces -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="bottle.jsx"></script>
<script type="text/babel" src="screens/Home.jsx"></script>
<script type="text/babel" src="screens/Scan.jsx"></script>
<script type="text/babel" src="screens/Detail.jsx"></script>
<script type="text/babel" src="screens/Add.jsx"></script>
<script type="text/babel" src="screens/Dose.jsx"></script>
<script type="text/babel" src="screens/Trends.jsx"></script>
<script type="text/babel" src="screens/Alerts.jsx"></script>
<script type="text/babel" src="screens/Share.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="react">
function Root() {
  // Installed → the app IS the device; fill the real screen.
  if (window.PWA && window.PWA.isStandalone) {
    return (
      <div className="fullapp">
        <App />
      </div>
    );
  }
  // Browser → show the app inside a device frame, plus an install banner.
  return (
    <React.Fragment>
      <div className="stage">
        <IOSDevice width={390} height={844}>
          <App />
        </IOSDevice>
      </div>
      <InstallUI />
    </React.Fragment>
  );
}

const boot = document.getElementById('boot');
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
// Render is synchronous — hide the splash right away (rAF is unreliable when
// the frame isn't focused). Keep a short fallback just in case.
function hideBoot() { if (boot) boot.style.display = 'none'; }
hideBoot();
setTimeout(hideBoot, 400);
</script>

<!-- Register the service worker for offline + installability -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
